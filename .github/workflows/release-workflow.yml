name: Build and release docker image

on:
  workflow_call:
    inputs:
      service-name: # 서비스 이름
        required: true 
        type: string

      file-name: # Dockerfile의 이름
        required: true
        type: string

      tag-prefix: 
        required: false
        type: string
        default: "v"

    secrets: 
      DOCKER_USERNAME: # Docker Hub 아이디
        required: true
      DOCKER_PASSWORD: # Docker Hub 비밀번호/토큰
        required: true

env:
  REGISTRY: docker.io

jobs:
  # 태깅 및 릴리즈
  tagging:
    name: 태깅 및 릴리즈
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag_version.outputs.new_tag }}
      changelog: ${{ steps.tag_version.outputs.changelog }}

    steps:
      - uses: actions/checkout@v5 # 현재 코드 가져오기

        # 버전 태그 생성
      - name: versioning and tagging 
        id: tag_version 
        uses: mathieudutour/github-tag-action@v6.2 # 태그 생성용 액션 사용
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} # 깃허브 권한 토큰 (자동 생성됨)
          tag_prefix: ${{ inputs.tag-prefix }} # 접두사 적용

        # 릴리즈 노트 생성
      - name: releasing
        uses: ncipollo/release-action@v1 # 릴리즈 생성용 액션 사용
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }} # 위에서 만든 태그 사용
          name: ${{ steps.tag_version.outputs.new_tag }} # 릴리즈 이름 = 태그
          body: ${{ steps.tag_version.outputs.changelog }} # 변경 로그 내용을 본문에 작성

  # docker 이미지 빌드
  build-image:
    name: 도커 이미지 빌드
    runs-on: ubuntu-latest
    needs: tagging # tagging 이후에 실행

    permissions: 
      contents: read # 코드 읽기 권한

    steps:
        # 코드 가져오기
      - name: Check out Repository
        uses: actions/checkout@v5

        # 액션 불러오기
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

        # 도커 로그인
      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
  
        # 이미지에 붙일 태그 및 라벨 생성
      - name: Tagging image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ inputs.service-name }}
          tags: |
            type=raw,value=${{ needs.tagging.outputs.tag_name }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          file: ./${{ inputs.file-name }} # Dockerfile
          push: true # 빌드 후 push
          tags: ${{ steps.meta.outputs.tags }} # 태그 적용
          labels: ${{ steps.meta.outputs.labels }} # 라벨 적용
          cache-from: type=gha # 깃허브 액션 캐시 사용
          cache-to: type=gha,mode=max # 캐시 저장